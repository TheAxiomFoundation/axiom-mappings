slot_notes:
  income_note: PE keeps one countable unearned aggregate; the composition sums a dozen unearned slots. All of PE's
    unearned income enters as other_gain_or_benefit_payments; the other slots are zero presumptions.
  gates_note: 'D42/D43 audit (2026-09-11): a presumption may not switch a rule on. The three gates that switched
    an entitlement on -- dependent-care necessity (10 CCR 2506-1 4.407.4), child-support verification (4.407.5),
    homeless shelter costs (4.407.3(C)) -- follow the PE fact that establishes each, through positive_of, so where
    PE carries no expense the rule is inert. household_lives_in_application_state stays true: inside the scope (D37)
    the household''s state_code is the application state by construction, and outside it PE answers. Finding 21
    is unchanged: PE''s countable child support is a fact, and the composition still subtracts it twice. Finding
    22: PE''s own homeless branch also counts the utility allowance as a shelter cost, and the composition''s homeless
    line is not reached by any bound output.'
  date_note: 'D38: application_date and public_institution_release_date are date slots. The Python extension carries
    no date column, so they hold a placeholder and no bound output evaluates them (the initial-month proration chain
    is not bound).'
  resource_note: PE snap_assets is already-counted liquid resources. Carry this yearly stock without monthly division
    into the valuation input actually used by total_household_resources_before_exclusions. The separate cash_on_hand
    enumeration is not read by the bound resource chain and stays zero; do not double-count the aggregate. Other
    resource components and exclusions remain zero because PE supplies the counted aggregate. Categorical exemption
    continues to follow meets_snap_categorical_eligibility.
  utility_note: 'Each utility-cost fact is PE''s yearly expense above zero (pre-subsidy electricity, as PE''s own
    utility count uses, to avoid the subsidy''s SNAP dependence). Heating or cooling is has_heating_cooling_expense.
    LEAP receipt: PE''s always-SUA parameter marks the Heat-and-Eat states (CO among them) where every SNAP household
    is deemed to receive the nominal energy payment; the composition reads that as LEAP or E-EBT receipt, which
    is the same presumption stated as a fact.'

notes:
  parameters_note: 'Not projected: the composition''s own parameters are two boarder constants; the SNAP tables
    live in imported modules, which projection does not read. A reform on a mapped PE path therefore unbinds (rule
    4) instead of pinning.'
  scope_note: 'D37: the composition is Colorado law (10 CCR 2506-1 over the federal FY 2026 tables). Outside Colorado
    PE''s own formula answers; the shadow compares Colorado rows only.'
  effective_note: 'D40: the composition carries the FY 2026 tables (effective 2025-10-01). From 2026-10-01 PE uprates
    the tables to FY 2027; outside the window PE answers and the shadow compares nothing.'
  inputs_note: 'Every slot the composition reads is listed: a PE variable, an adapter, or a const presumption (false
    / 0 / 1 for divisors). Scaffolded by scripts/scaffold_manifest_inputs.py; column types verified against the
    engine output by output.'

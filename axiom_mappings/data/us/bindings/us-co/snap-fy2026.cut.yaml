      citizen_note: 'Presumption: PE''s SNAP immigration-status eligibility stands in for citizenship; the alien-status
        branches stay false, so the member-level judgment agrees with PE''s.'
      work_note: 'Registrants are presumed compliant (as PE does); PE''s per-person work-requirement judgment enters
        as the one non-compliance flag. The composition then requires every member eligible; PE requires any. Expected
        shadow difference. D42/D43: the six compliance gates of 7 CFR 273.7(a)(1) stay true because true is their
        inert value -- false would fire a disqualification PE never applies. PE''s only non-compliance evidence
        (is_snap_work_registration_noncompliant, default false, absent from Populace) already enters through member_voluntarily_quit_or_reduced_work_below_30_hours_without_good_cause.'
      student_note: 'Presumption: PE''s ineligible-student determination already applies the eight exemptions, so
        it plays the enrolment facts and the exemption facts stay false.'
bindings:
- pe_variable: snap_max_allotment
  axiom_output: snap_maximum_allotment
  status: 'on'
  parameters:
    snap_maximum_allotment_table: gov.usda.snap.max_allotment.main
    snap_maximum_allotment_additional_member: gov.usda.snap.max_allotment.additional
- pe_variable: snap_standard_deduction
  axiom_output: snap_standard_deduction
  status: 'on'
  parameters:
    snap_standard_deduction_48_states_dc_table: gov.usda.snap.income.deductions.standard
- pe_variable: snap_earned_income_deduction
  axiom_output: snap_earned_income_deduction_for_net_income
  status: shadow
  parameters:
    snap_earned_income_deduction_rate_for_net_income: gov.usda.snap.income.deductions.earned_income
  notes:
    note: 7 CFR 273.10(e)(1)(i)(B) floors the deduction; PE does not round. Expect sub-dollar differences.
- pe_variable: snap_min_allotment
  axiom_output: snap_minimum_monthly_allotment
  status: 'on'
  parameters:
    snap_minimum_allotment_rate: gov.usda.snap.min_allotment.rate
- pe_variable: snap_excess_shelter_expense_deduction
  axiom_output: snap_excess_shelter_deduction
  status: shadow
  notes:
    known_differences:
    - 'Finding 19: the composition defines net income before shelter twice. The final net income uses `medical_deduction`,
      which applies Colorado''s $165 SMD (7 CFR 273.9(d)(3)); the shelter cost uses `snap_net_income_before_shelter`,
      whose medical term is the plain max(0, medical - 35). PE applies the SMD consistently, so the shelter deduction
      differs by half the medical difference. Internal inconsistency upstream in rulespec-us, not a mapping error.'
    - 'Finding 20: the composition rounds to whole dollars (floor(x+0.5)) and floors the earned-income deduction
      per 273.10(e)(1)(i)(B); PE keeps cents. Bounds the residual at about $1. Rounding-policy decision, not a defect.'
- pe_variable: snap_net_income
  axiom_output: snap_net_income
  status: shadow
  notes:
    known_differences:
    - 'Finding 21: the composition subtracts child support twice - once via snap_income_exclusions inside snap_total_gross_income,
      then again in snap_net_income_pre_shelter. Colorado excludes it from gross under 7 CFR 273.9(d)(5); exclusion
      or deduction, never both. PE does it once. The gap equals the child-support amount exactly on all 125 differing
      Colorado units. No manifest-side fix: presuming the verification gate false would also zero the gross-income
      exclusion and break gross income. Fix upstream in rulespec-us.'

# policyengine-axiom bindings for us/snap-elderly-disabled-member (cut profile: read from a live PolicyEngine simulation).
# Imported from policyengine-axiom manifests/us-snap-elderly-disabled.json at 3a9222d; edit here, then export with
# python -m axiom_mappings.export.policyengine_axiom --out <policyengine-axiom>/manifests
program: us/snap-elderly-disabled-member
profile: cut
consumers:
- policyengine-axiom
root_entity: Household
entity_map:
  Household: spm_unit
  Person: person
relations:
  member_of_household:
    inputs:
      snap_member_is_elderly_or_disabled: {any_of: [is_usda_elderly, is_usda_disabled]}
bindings:
- pe_variable: has_usda_elderly_disabled
  axiom_output: snap_household_has_elderly_or_disabled_member
  status: 'on'
  reduce: any
  notes:
    note: Axiom's rule is monthly on the SNAP household; PE's variable is yearly on the SPM unit. Any month holding
      makes the year hold. The member flag is PE's two person flags combined.

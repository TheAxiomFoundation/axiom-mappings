# axiom-api bindings for us/snap (facts profile: read from a request, in axiom-api's serving-map
# grammar). Imported from axiom-api data/serving-map/us-snap.json at c8e2d42; edit here, then export with
# python -m axiom_mappings export axiom-api --out <axiom-api>/data/serving-map
program: us/snap
profile: facts
consumers:
- axiom-api
format: axiom-pe-variable-mapping/1
description: SNAP via the state registry packages (us-az, us-ca, us-co, us-ny). Mirrors the behavior of src/household-compat.ts
  today; the compat endpoint will interpret this file directly once the bridge is data-driven (Phase 2).
targets:
- kind: package
  jurisdiction_from_state: true
  program_id: '*-snap'
  period_scope: fiscal-year
variables:
  snap:
    symbol: snap_benefit_amount
    entity: spm_unit
    period: annualize-monthly
    round: cents
  snap_if_takes_up:
    symbol: snap_benefit_amount
    entity: spm_unit
    period: annualize-monthly
    round: cents
    notes: PolicyEngine's snap is snap_if_takes_up for an SPM unit that takes up SNAP (takes_up_snap_if_eligible,
      default true). The packages model no take-up, so their benefit is snap_if_takes_up at every take-up value.
  snap_gross_income:
    symbol: snap_gross_income
    entity: spm_unit
    period: annualize-monthly
    round: cents
  snap_net_income:
    symbol: snap_net_income
    entity: spm_unit
    period: annualize-monthly
    round: cents
inputs:
  household_size: {from: {count: spm_unit.members}}
  snap_gross_monthly_income: {from: {sum: [employment_income, self_employment_income, unemployment_compensation,
        social_security, ssi, pension_income], scope: people}, period: monthly-from-annual, round: cents}
  shelter_costs:
    from:
      first:
      - housing_cost
      - sum: [rent, real_estate_taxes, homeowners_association_fees, mortgage_payments, homeowners_insurance]
        scope: spm_unit+members
    period: monthly-from-annual
    round: cents
    notes: PolicyEngine's housing_cost adds these components (rent and real_estate_taxes per person, the rest per
      SPM unit), and a sent housing_cost overrides the sum; a request carries no computed variables, so read the
      components when housing_cost is not sent.
  member_age: {from: age, period: annual}
  dependent_care_deduction: {from: {sum: [spm_unit_pre_subsidy_childcare_expenses, childcare_expenses], scope: spm_unit},
    period: monthly-from-annual, round: cents, notes: NY declares the deduction itself as an input; other packages
      use the expense slots above.}
  snap_allowable_monthly_dependent_care_expenses: {from: {sum: [spm_unit_pre_subsidy_childcare_expenses, childcare_expenses],
      scope: spm_unit}, period: monthly-from-annual, round: cents, notes: CA/NY/AZ packages' dependent-care input
      (monthly).}
  dependent_care_expenses_paid: {from: {sum: [spm_unit_pre_subsidy_childcare_expenses, childcare_expenses], scope: spm_unit},
    period: monthly-from-annual, round: cents, notes: CO package's dependent-care input (monthly).}
presumptions:
  household_lives_in_application_state:
    value: true
    presumption: procedural-eligibility
  member_is_us_citizen:
    value: true
    presumption: procedural-eligibility
  member_registered_for_work_or_registered_by_state:
    value: true
    presumption: procedural-eligibility
  member_provided_employment_status_or_availability_information:
    value: true
    presumption: procedural-eligibility
  member_accepted_bona_fide_suitable_employment_offer_if_offered:
    value: true
    presumption: procedural-eligibility
  member_participated_in_snap_et_if_assigned:
    value: true
    presumption: procedural-eligibility
  member_participated_in_workfare_if_assigned:
    value: true
    presumption: procedural-eligibility
  member_reported_to_referred_suitable_employer_if_referred:
    value: true
    presumption: procedural-eligibility
  dependent_care_expense_necessary_for_work_or_training:
    value: true
    presumption: claimed-expense-qualifies
evidence:
  golden_cases:
  - contract-az-snap-incomes
  - contract-ca-snap-incomes
  - contract-ca-snap-monthly
  - contract-co-snap-incomes
  - contract-co-snap-monthly
  - contract-ny-snap-incomes
  - client-2bvocxth
  - client-cxwdaxfi
  - client-dq9pluou
  - contract-dq9pluou-renter
  known_differences:
  - fy2027-cola-projection
  - allotment-rounding
  notes:
  - 'Procedural-eligibility presumptions verified against us-ca: without them an income-eligible household receives
    0.'
  - 'dependent_care_deduction added 2026-08-23 after the first production triage (axiom-api#169): partner shapes
    carry childcare expenses PE deducts and Axiom previously ignored.'
  - 'Dependent-care slots are package-specific (CO: dependent_care_expenses_paid + necessary-for-work gate; CA/NY/AZ:
    snap_allowable_monthly_dependent_care_expenses); PE deducts childcare without a work-necessity question, so
    the gate is presumed true and disclosed.'
  - 'shelter_costs reads housing_cost''s components since 2026-11-09 (axiom-api#323): before, a household that
    sent rent and no housing_cost got no shelter deduction. DQ9PLUoU sends rent without housing_cost in 5,081 of
    its 12,126 requests (90 days to 2026-11-07). contract-dq9pluou-renter: Door 2 576 before, 2,688 after,
    PolicyEngine 2,712 (the rest is fy2027-cola-projection).'
  - 'overrides added 2026-08-24 (#159): partners send PE intermediates as inputs; each maps to the package fact of
    that name: a scalar-rule pin, which the package path applies on every executor (axiom-api#243) and names in the
    runtime''s warnings, or an input slot where the package has one (us-co''s countable earned income). Until
    2026-11-09 the income pins did not reach the benefit in us-az, us-ca and us-ny (axiom-api#247, next note).'
  - 'snap_earned_income and snap_unearned_income retargeted 2026-11-09 (axiom-api#247). They pinned
    snap_countable_earned_income and snap_countable_unearned_income, which no rule on the benefit path reads in us-az
    and us-ca, and which the gross income does not read in us-ny. PolicyEngine 2.94.7 adds both to snap_gross_income,
    which its gross and net income tests read, and its earned income deduction is 20% of snap_earned_income. The
    packages read snap_gross_monthly_earned_income (gross income and the earned income deduction) and
    snap_total_monthly_unearned_income (gross income). Door 2 replay: contract-cxwdaxfi-single 0 to 3,576,
    parent-child 5,856 to 6,552, couple-child 0 to 9,420; PolicyEngine 3,608, 6,610 and 9,503 (the rest is
    fy2027-cola-projection).'
  - 'snap_if_takes_up added 2026-11-09 (axiom-api#324): in policyengine-us 2.94.7, snap adds snap_if_takes_up and is
    defined for takes_up_snap_if_eligible. 2bvOcXtH, 1AR7c1FQ, qSH0K7up and OlO42DIY request it (90 days to
    2026-11-07). No golden requests it yet.'
overrides:
  snap_excess_shelter_expense_deduction:
    pin: snap_excess_shelter_deduction_for_net_income
    period: monthly-from-annual
    round: cents
    notes: PE honors a sent shelter-deduction value as an override; pin the packages' scalar rule to match (verified
      against contract-dq9pluou-parent-child on a local executor; the hosted package path applies the same pin since
      axiom-api#243).
  snap_earned_income:
    pin: snap_gross_monthly_earned_income
    period: monthly-from-annual
    round: cents
    notes: PE's snap_gross_income adds snap_earned_income, and its earned income deduction is 20% of it. The packages'
      gross income and earned income deduction read snap_gross_monthly_earned_income, an input slot in us-az, us-ca and
      us-ny and a pinned scalar rule in us-co (axiom-api#247).
  snap_unearned_income:
    pin: snap_total_monthly_unearned_income
    period: monthly-from-annual
    round: cents
    notes: PE's snap_gross_income adds snap_unearned_income. The packages' gross income reads
      snap_total_monthly_unearned_income, an input slot in us-az, us-ca and us-ny and a pinned scalar rule in us-co
      (axiom-api#247).

# Facts the data does not carry, and what is presumed for them. Every constant input rule should
# name one of these; answers disclose the presumptions they relied on.
presumptions:
- id: procedural-eligibility
  meaning: The household meets procedural requirements PolicyEngine does not model (residency declaration, SSN,
    citizenship documentation, work registration and compliance). Entitlement is computed as for a procedurally
    eligible household.
  disclosure: Procedural eligibility presumed.
- id: not-in-data
  meaning: The population data carries no value for this fact, so zero or false is used.
  disclosure: Facts absent from the data are treated as zero or false.
- id: test-fixture-default
  meaning: A value copied from a RuleSpec companion test fixture. It is not a statement about the population and
    should be replaced by a mapped concept or one of the presumptions above.
  disclosure: Some inputs use test-fixture defaults.
  acceptable: false

# Facts the data does not carry, and what is presumed for them. Every constant input rule should
# name one of these; answers disclose the presumptions they relied on.
presumptions:
- id: procedural-eligibility
  meaning: The household meets procedural requirements PolicyEngine does not model (residency declaration, SSN,
    citizenship documentation, work registration and compliance). Entitlement is computed as for a procedurally
    eligible household.
  disclosure: Procedural eligibility presumed.
- id: not-in-data
  meaning: The population data carries no value for this fact, so zero or false is used.
  disclosure: Facts absent from the data are treated as zero or false.
- id: test-fixture-default
  meaning: A value copied from a RuleSpec companion test fixture. It is not a statement about the population and
    should be replaced by a mapped concept or one of the presumptions above.
  disclosure: Some inputs use test-fixture defaults.
  acceptable: false
- id: neutral-divisor
  meaning: A count or period the rule divides by, where the data already carries the per-period amount. Set to 1
    so the amount passes through unchanged (0 would divide by zero).
  disclosure: Averaging periods and shares are taken as 1 where the data is already per period.
- id: data-period
  meaning: The period a rule averages or reports over, set to the data's own period (annual amounts over 12
    months, monthly pay frequency).
  disclosure: Averaging periods follow the data's reporting period.
- id: law-supplied
  meaning: A value of law the consumer supplies because the encoding does not read it from its own source (e.g.
    the federal minimum wage). It belongs in RuleSpec; until it is there the program is not ready (D48).
  disclosure: Some values of law are supplied by the consumer, not encoded.
  acceptable: false
- id: claimed-expense-qualifies
  meaning: An expense the household reports is presumed to meet the program's qualifying conditions (dependent
    care necessary for work or training). It switches a deduction on, which policyengine-axiom's D43 forbids a
    presumption to do; there the fact follows PolicyEngine's own deduction instead.
  disclosure: Reported expenses are presumed to qualify.
  acceptable: false
- id: population-scope
  meaning: A fact that defines the population the calculation is for (an individual taxpayer, not an estate or
    trust), true by construction of the request.
  disclosure: The request describes an individual taxpayer.

[project]
name = "axiom-mappings"
version = "0.1.0"
description = "The shared map between Axiom RuleSpec concepts and PolicyEngine variables and parameters"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
policyengine = ["policyengine-us==1.808.0", "spm-calculator==0.3.1", "policyengine-core==3.30.2"]  # policyengine-us under-declares spm-calculator
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["axiom_mappings"]

[tool.setuptools.package-data]
axiom_mappings = ["data/*.yaml", "data/*/*.yaml", "schema/*.json", "pins.yaml"]

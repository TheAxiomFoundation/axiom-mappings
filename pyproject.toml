[project]
name = "axiom-mappings"
version = "0.1.0"
description = "The shared map between Axiom RuleSpec concepts and PolicyEngine variables and parameters"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
policyengine = ["policyengine-us==2.94.7", "policyengine-core==3.33.1"]  # the household API's pair; 2.x declares spm-calculator itself
test = ["pytest>=8"]
investigate = ["anthropic>=1.11"]  # python -m axiom_mappings investigate --live

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["axiom_mappings*"]

[tool.setuptools.package-data]
axiom_mappings = ["data/*.yaml", "data/*/*.yaml", "data/*/bindings/**/*.yaml", "schema/*.json", "conformance/*.json", "pins.yaml"]
